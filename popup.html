<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitSyncMarks</title>
  <link rel="stylesheet" href="ui-density.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="whats-new.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-header-left">
        <img src="icons/icon48-plain.png" alt="" class="popup-icon">
        <h1>GitSyncMarks</h1>
      </div>
      <select id="profile-select" class="profile-select header-profile" style="display: none;"></select>
    </header>

    <!-- Not configured state -->
    <div id="not-configured" class="state" style="display: none;">
      <div class="status-box status-warning panel-compact">
        <span class="status-icon">⚙️</span>
        <span data-i18n="popup_configureFirst">Please configure the extension first.</span>
      </div>
      <button id="open-settings-btn" class="btn btn-primary btn-full" data-i18n="popup_openSettings">Open Settings</button>
    </div>

    <!-- Configured / main state -->
    <div id="configured" class="state" style="display: none;">
      <!-- Status area (replaces status-box for cleaner hierarchy) -->
      <div id="status-area" class="status-area" role="status" aria-live="polite" aria-atomic="true">
        <div class="status-line">
          <span id="status-message" data-i18n="popup_ready">Ready</span>
        </div>
        <div class="status-meta">
          <span id="last-data-change" class="status-meta-item" style="display: none;"></span>
          <span id="last-commit-wrap" class="status-meta-item last-commit-wrap" style="display: none;"></span>
          <span id="mirror-status" class="status-meta-item" style="display: none;"></span>
          <span id="token-expiry" class="status-meta-item" style="display: none;"></span>
          <span id="offline-status" class="status-meta-item" style="display: none;" data-i18n="popup_offline">Offline — sync resumes when you are back online.</span>
        </div>
      </div>

      <!-- Conflict warning -->
      <div id="conflict-box" class="conflict-box panel-compact" style="display: none;">
        <div class="conflict-header">
          <span>⚠️</span>
          <strong data-i18n="popup_conflictDetected">Conflict detected</strong>
        </div>
        <p id="conflict-description" data-i18n="popup_conflictDescription">Both local and remote bookmarks were modified. Choose a resolution:</p>
        <ul id="conflict-files" class="conflict-files"></ul>
        <div class="conflict-actions">
          <button id="force-push-btn" class="btn btn-small btn-warning" data-i18n="popup_localToRemote">Local → Remote</button>
          <button id="force-pull-btn" class="btn btn-small btn-secondary" data-i18n="popup_remoteToLocal">Remote → Local</button>
        </div>
      </div>

      <!-- Inline confirmation before an overwrite or a profile switch -->
      <div id="confirm-box" class="conflict-box panel-compact" role="alertdialog" aria-labelledby="confirm-text" style="display: none;">
        <p id="confirm-text"></p>
        <div class="conflict-actions">
          <button id="confirm-yes-btn" class="btn btn-small btn-warning" data-i18n="popup_confirmBtn">Confirm</button>
          <button id="confirm-no-btn" class="btn btn-small btn-secondary" data-i18n="options_profileSwitchCancelBtn">Cancel</button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <button id="sync-btn" class="btn btn-primary btn-full">
          <span class="btn-content">
            <span id="sync-spinner" class="spinner" style="display: none;"></span>
            <span id="sync-text" data-i18n="popup_syncNow">Sync Now</span>
          </span>
        </button>
        <button id="restore-backup-btn" class="btn btn-secondary btn-full" style="display: none;" data-i18n="popup_restoreBackup">Restore local backup</button>
        <div class="action-row">
          <button id="push-btn" class="btn btn-secondary btn-half" data-i18n="popup_pushUp">Push ↑</button>
          <button id="pull-btn" class="btn btn-secondary btn-half" data-i18n="popup_pullDown">Pull ↓</button>
        </div>
      </div>

      <!-- Auto-sync indicator (compact: dot + text or countdown) -->
      <div id="auto-sync-status" class="auto-sync-status">
        <span id="auto-sync-dot" class="dot dot-active"></span>
        <span id="auto-sync-text" data-i18n="popup_autoSyncActive">Auto-sync active</span>
        <span id="next-sync-countdown" class="next-sync-countdown" style="display: none;"></span>
      </div>
    </div>

    <footer class="popup-footer">
      <a id="settings-link" href="#" data-i18n="popup_settings">Settings</a>
      <span class="footer-sep">·</span>
      <a href="https://gitsyncmarks.com" target="_blank" rel="noopener" data-i18n="popup_website">Website</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/d0dg3r/GitSyncMarks" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep">·</span>
      <a id="diagnostics-link" href="#" data-i18n="popup_diagnostics">Copy diagnostics</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/d0dg3r/GitSyncMarks/issues" target="_blank" rel="noopener" data-i18n="popup_reportIssue">Report Issue</a>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
