# Keep this workflow disabled so a mirrored tag does not rebuild or race the copy.
name: Build & Release Extension (disabled — runs on forgejo.lan)

on:
  workflow_dispatch:

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Point to Forgejo
        run: |
          echo "Release builds run on forgejo.lan (.forgejo/workflows/release.yml)."
          echo "GitHub only receives copied ZIPs via GITSYNCMARKS_RELEASE_PAT."
